<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Disciplinary Committee Profile — BCF-SL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          primary: '#1e3a5f', 'primary-light': '#2563eb', accent: '#7c3aed',
          danger: '#dc2626', warning: '#d97706', success: '#16a34a',
          surface: '#f8fafc', 'surface-card': '#ffffff', outline: '#e2e8f0',
          'on-surface': '#0f172a', 'on-variant': '#475569'
        },
        fontFamily: { sans: ['Inter','sans-serif'], display: ['Plus Jakarta Sans','sans-serif'] }
      }}
    };
  </script>
  <style>
    body { overscroll-behavior-y: none; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeUp .3s ease-out; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

<!-- HEADER -->
<header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-900 to-rose-700 flex items-center justify-center shadow">
        <span class="material-symbols-outlined text-white text-[18px]">badge</span>
      </div>
      <div>
        <div class="text-[10px] font-black uppercase tracking-widest text-red-900">BCF-SL · Discipline</div>
        <h1 class="text-sm font-black text-slate-900 font-display leading-tight">Disciplinary Committee Profiles</h1>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="../disciplinary_committee_registration_log/code.html" class="flex items-center gap-1.5 px-3 py-1.5 border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold rounded-lg transition shadow-sm">
        <span class="material-symbols-outlined text-[15px]">group_add</span> Register
      </a>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-6 space-y-6 pb-20">
  
  <!-- Summary Banner -->
  <div class="bg-white rounded-xl border border-slate-200 border-t-4 border-t-red-800 p-5 shadow-sm fade-up flex items-center justify-between">
    <div>
      <h2 class="text-base font-bold text-slate-900">Disciplinary Panel Members</h2>
      <p class="text-xs text-slate-500">View and manage profile cards for disciplinary committee personnel.</p>
    </div>
    <div class="text-right">
      <div class="text-2xl font-black text-red-900 font-display" id="total-count">0</div>
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Total Members</div>
    </div>
  </div>

  <!-- Profile Grid -->
  <div id="profile-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 fade-up">
    <!-- Populated by JS -->
  </div>

</main>

<!-- BOTTOM NAV -->
<nav class="fixed bottom-0 w-full z-40 bg-white border-t border-slate-200 shadow-lg">
  <div class="max-w-md mx-auto flex items-center justify-around h-14 text-[10px] font-bold">
    <a href="../committee_registration_log/code.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-900 transition">
      <span class="material-symbols-outlined text-[22px]">group_add</span><span>Register</span>
    </a>
    <a href="../committee_profile/code.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-blue-900 transition">
      <span class="material-symbols-outlined text-[22px]">badge</span><span>Profile</span>
    </a>
    <a href="code.html" class="flex flex-col items-center gap-0.5 text-red-900">
      <span class="material-symbols-outlined text-[22px]">gavel</span><span>Disciplinary</span>
    </a>
    <a href="../accused_suspect_profile/code.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-red-900 transition">
      <span class="material-symbols-outlined text-[22px]">person_alert</span><span>Accused</span>
    </a>
    <a href="../investigation_case_register_log/code.html" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-red-900 transition">
      <span class="material-symbols-outlined text-[22px]">manage_search</span><span>Cases</span>
    </a>
  </div>
</nav>

<script>
  const STORE_KEY = 'bcf_disciplinary_committee_members';
  const DESIGNATION_COLORS = { Chairman: 'bg-red-100 text-red-800', 'Vice Chairman': 'bg-rose-100 text-rose-800', Member: 'bg-slate-100 text-slate-700' };

  function renderProfiles() {
    let members = [];
    try { members = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch {}
    
    document.getElementById('total-count').textContent = members.length;
    const grid = document.getElementById('profile-grid');
    
    if (members.length === 0) {
      grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400">No disciplinary members found. Please register members first.</div>';
      return;
    }

    grid.innerHTML = members.map(m => `
      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition">
        <div class="bg-slate-50 p-4 border-b border-slate-100 flex items-start gap-3">
          <div class="w-12 h-12 rounded-full bg-red-100 text-red-800 flex items-center justify-center font-bold text-lg shrink-0">
            ${m.name.charAt(0)}
          </div>
          <div>
            <h3 class="font-bold text-slate-900 leading-tight">${m.name}</h3>
            <div class="text-xs text-slate-500 mt-0.5">${m.position}</div>
            <span class="inline-block mt-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold ${DESIGNATION_COLORS[m.designation] || 'bg-slate-100 text-slate-700'}">${m.designation}</span>
          </div>
        </div>
        <div class="p-4 space-y-2 text-xs">
          <div class="flex justify-between border-b border-slate-50 pb-1">
            <span class="text-slate-500">Committee Type</span>
            <span class="font-semibold text-slate-800">${m.type}</span>
          </div>
          <div class="flex justify-between border-b border-slate-50 pb-1">
            <span class="text-slate-500">Job Level</span>
            <span class="font-semibold text-slate-800">${m.jobLevel}</span>
          </div>
          <div class="flex justify-between pb-1">
            <span class="text-slate-500">Mgmt Level</span>
            <span class="font-semibold text-slate-800">${m.mgmtLevel}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  document.addEventListener('DOMContentLoaded', renderProfiles);
  window.addEventListener('storage', e => { if (e.key === STORE_KEY) renderProfiles(); });
  try {
    new BroadcastChannel('bcf_disciplinary_channel').onmessage = (e) => {
      if (e.data.type === 'COMMITTEE_UPDATED') renderProfiles();
    };
  } catch {}
</script>
</body>
</html>
