<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BCF-SL Organisational Chart</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; color: #111; }

  .page-header {
    background: linear-gradient(135deg, #0D1B2A 0%, #1F4E79 100%);
    color: #fff; padding: 22px 30px; text-align: center;
  }
  .page-header h1 { font-size: 20px; letter-spacing: 1px; text-transform: uppercase; }
  .page-header p { font-size: 12px; color: #C9A84C; margin-top: 4px; }

  .nav-tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 14px 20px; background: #fff;
    border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .nav-tab {
    padding: 6px 13px; border-radius: 20px; font-size: 11.5px; font-weight: 600;
    cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-tab:hover { opacity: 0.85; transform: translateY(-1px); }
  .nav-tab.active { color: #fff !important; }

  .dept-section { display: none; padding: 28px 24px; }
  .dept-section.active { display: block; }

  .dept-title {
    font-size: 17px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; margin-bottom: 22px; padding: 10px 18px;
    border-radius: 8px; color: #fff; display: inline-block;
  }

  /* Org tree */
  .org-tree { overflow-x: auto; padding-bottom: 10px; }
  .level { display: flex; justify-content: center; gap: 12px; flex-wrap: nowrap; margin-bottom: 0; }

  .node-wrap { display: flex; flex-direction: column; align-items: center; position: relative; }

  /* connector lines */
  .node-wrap::before {
    content: ''; display: block; width: 2px; height: 20px;
    background: #ccc; margin: 0 auto;
  }
  .node-wrap:first-child:last-child::before { display: none; }

  /* horizontal line above siblings */
  .siblings { display: flex; gap: 12px; position: relative; justify-content: center; }
  .siblings::before {
    content: ''; position: absolute; top: 0; left: calc(50% - 50%);
    height: 2px; background: #ccc;
    left: 0; right: 0;
  }

  .card {
    border-radius: 8px; padding: 8px 12px; text-align: center;
    font-size: 11px; line-height: 1.35; min-width: 130px; max-width: 165px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12); position: relative; z-index: 1;
    border: 2px solid transparent;
  }
  .card .role { font-size: 10px; font-weight: 500; margin-bottom: 2px; }
  .card .name { font-size: 11.5px; font-weight: 700; line-height: 1.3; }
  .card .badge {
    display: inline-block; font-size: 9px; font-weight: 700;
    padding: 1px 6px; border-radius: 10px; margin-top: 4px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }

  /* level colours per tier */
  .tier-director { background: #0D1B2A; color: #C9A84C; border-color: #C9A84C; }
  .tier-director .badge { background: #C9A84C; color: #0D1B2A; }

  .tier-manager { color: #fff; }
  .tier-manager .badge { background: rgba(255,255,255,0.25); color: #fff; }

  .tier-assistant { background: #fff; border-width: 2px; }
  .tier-assistant .badge { color: #fff; }

  .tier-officer { background: #f8f9fc; border-width: 1.5px; }
  .tier-officer .badge { color: #fff; }

  /* connector from parent down */
  .connector-down { width: 2px; height: 22px; background: #ccc; margin: 0 auto; }
  .connector-h-wrap { display: flex; align-items: flex-start; justify-content: center; position: relative; }
  .connector-h { height: 2px; background: #ccc; position: absolute; top: 0; }

  /* unit block */
  .unit-block { margin-bottom: 32px; }
  .unit-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    padding: 4px 14px; border-radius: 20px; color: #fff;
    display: inline-block; margin-bottom: 14px;
  }

  .tree-container { display: flex; flex-direction: column; align-items: center; }
  .children-row { display: flex; gap: 14px; justify-content: center; align-items: flex-start; margin-top: 0; }
  .child-col { display: flex; flex-direction: column; align-items: center; }
  .vline { width: 2px; height: 20px; background: #ccc; }
  .hline-wrap { position: relative; display: flex; justify-content: center; }

  /* grid layout for units */
  .units-grid { display: flex; flex-direction: column; gap: 24px; }

  .summary-bar {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: 22px;
  }
  .summary-pill {
    padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 600;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .summary-pill span { font-weight: 700; }
</style>
</head>

const levelLabels = { manager: "Unit Manager", assistant: "Assistant Officer", officer: "Officer" };
const levelBadge = { manager: "Manager", assistant: "Assistant", officer: "Officer" };

function makeCard(title, level, color, unitColor) {
  let bg, border, textColor, badgeBg, badgeText;
  if (level === "director") {
    bg = "#0D1B2A"; border = "#C9A84C"; textColor = "#C9A84C"; badgeBg = "#C9A84C"; badgeText = "#0D1B2A";
  } else if (level === "manager") {
    bg = color; border = color; textColor = "#fff"; badgeBg = "rgba(255,255,255,0.25)"; badgeText = "#fff";
  } else if (level === "assistant") {
    bg = "#fff"; border = unitColor; textColor = "#111"; badgeBg = unitColor; badgeText = "#fff";
  } else {
    bg = "#f4f6f9"; border = "#ccc"; textColor = "#333"; badgeBg = "#999"; badgeText = "#fff";
  }
  const roleLabel = level === "director" ? "Department Director" : levelLabels[level] || "";
  const badge = level === "director" ? "Director" : levelBadge[level] || "Officer";
  return `<div class="card" style="background:${bg};border-color:${border};color:${textColor}">
    <div class="role" style="color:${level==='director'?'#C9A84C':textColor==='#fff'?'rgba(255,255,255,0.75)':'#666'}">${roleLabel}</div>
    <div class="name">${title}</div>
    <span class="badge" style="background:${badgeBg};color:${badgeText}">${badge}</span>
  </div>`;
}

function buildDept(dept) {
  const totalStaff = dept.units.reduce((a, u) => a + u.staff.length, 0) + 1;
  const totalUnits = dept.units.length;

  let html = `<div class="dept-section" id="dept-${dept.id}">
    <div class="dept-title" style="background:${dept.color}">${dept.title}</div>
    <div class="summary-bar">
      <div class="summary-pill" style="border-left:4px solid ${dept.color}">Total Staff: <span>${totalStaff}</span></div>
      <div class="summary-pill" style="border-left:4px solid ${dept.unitColor}">Units: <span>${totalUnits}</span></div>
      <div class="summary-pill" style="border-left:4px solid #888">Hierarchy Levels: <span>4</span></div>
    </div>`;

  // Director at top
  html += `<div class="tree-container">
    ${makeCard(dept.director, "director", dept.color, dept.unitColor)}
    <div class="vline"></div>`;

  // Units row
  html += `<div class="children-row">`;
  dept.units.forEach((unit, ui) => {
    html += `<div class="child-col">
      <div class="unit-label" style="background:${dept.unitColor}">${unit.name}</div>`;

    // Manager
    const mgr = unit.staff.find(s => s.level === "manager");
    if (mgr) {
      html += makeCard(mgr.title, "manager", dept.color, dept.unitColor);
      html += `<div class="vline"></div>`;
    }

    // Assistant
    const asst = unit.staff.find(s => s.level === "assistant");
    if (asst) {
      html += makeCard(asst.title, "assistant", dept.color, dept.unitColor);
      html += `<div class="vline"></div>`;
    }

    // Officers
    const officers = unit.staff.filter(s => s.level === "officer");
    if (officers.length) {
      html += `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">`;
      officers.forEach(o => {
        html += `<div>${makeCard(o.title, "officer", dept.color, dept.unitColor)}</div>`;
      });
      html += `</div>`;
    }

    html += `</div>`;
  });

  html += `</div></div>`;
  html += `</div>`;
  return html;
}

// Render nav tabs
const navTabs = document.getElementById("navTabs");
const containers = document.getElementById("deptContainers");

DEPTS.forEach((dept, i) => {
  const tab = document.createElement("div");
  tab.className = "nav-tab" + (i === 0 ? " active" : "");
  tab.textContent = dept.label;
  tab.style.background = i === 0 ? dept.color : "#eee";
  tab.style.color = i === 0 ? "#fff" : "#333";
  tab.style.borderColor = dept.color;
  tab.dataset.target = dept.id;
  tab.dataset.color = dept.color;
  tab.addEventListener("click", () => {
    document.querySelectorAll(".nav-tab").forEach(t => {
      t.classList.remove("active");
      t.style.background = "#eee";
      t.style.color = "#333";
    });
    document.querySelectorAll(".dept-section").forEach(s => s.classList.remove("active"));
    tab.classList.add("active");
    tab.style.background = dept.color;
    tab.style.color = "#fff";
    document.getElementById("dept-" + dept.id).classList.add("active");
  });
  navTabs.appendChild(tab);

  containers.innerHTML += buildDept(dept);
});

// Activate first
document.querySelector(".dept-section").classList.add("active");
</script>

  // Filter for APPROVED or ACTIVE
  registry = registry.filter(function(r) {
    return r.workflowStatus === 'APPROVED' || r.recordStatus === 'ACTIVE' || (!r.workflowStatus && !r.recordStatus);
  });
  
  if (!registry.length) return;

  // Map from register dept keys to organogram dept section IDs
  var DEPT_MAP = {
    'finance':     'finance',     'Finance':     'finance',
    'health':      'health',      'Health & Safety': 'health',
    'hr':          'hr',          'Human Resources Management': 'hr',
    'it':          'it',          'Information Technology (IT)': 'it',
    'audit':       'audit',       'Internal Risk & Audits': 'audit',
    'legal':       'legal',       'Legal & Communication': 'legal',
    'procurement': 'procurement', 'Procurement': 'procurement',
    'programs':    'programs',    'Programs':    'programs',
    'ceo':         'ceo',         'CEO':         'ceo',
  };

  // Build a banner container for new staff per department
  function getOrCreateNewStaffSection(deptId) {
    var deptSection = document.getElementById('dept-' + deptId);
    if (!deptSection) return null;
    var existingBanner = deptSection.querySelector('.new-staff-banner');
    if (existingBanner) return existingBanner;

    var banner = document.createElement('div');
    banner.className = 'new-staff-banner';
    banner.style.cssText = 'margin-top:24px; padding:16px; background:#fff; border-radius:10px; border:2px dashed #4CAF50; box-shadow:0 2px 8px rgba(76,175,80,0.12);';
    banner.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;"><span style="background:#4CAF50;color:#fff;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">New Staff</span><span style="font-size:12px;color:#666;">Registered via HR Portal</span></div><div class="new-staff-cards" style="display:flex;flex-wrap:wrap;gap:10px;"></div>';
    deptSection.appendChild(banner);
    return banner;
  }

  var newStaffCount = 0;

  registry.forEach(function(emp) {
    var deptKey = DEPT_MAP[emp.dept] || DEPT_MAP[emp.deptLabel] || DEPT_MAP[emp.department] || null;
    if (!deptKey) return;
    
    var level = (emp.managementLevel || emp.jobLevel || '').toLowerCase();
    var jobLevel = (emp.jobLevel || '').toLowerCase();
    
    // Check if Director
    if (level.includes('director') || jobLevel.includes('director') || level.includes('top management')) {
      var deptSection = document.getElementById('dept-' + deptKey);
      if (deptSection) {
        // The first card in tree-container is the Director
        var directorCard = deptSection.querySelector('.tree-container > .card');
        if (directorCard) {
          var nameEl = directorCard.querySelector('.name');
          var roleEl = directorCard.querySelector('.role');
          if (nameEl) nameEl.textContent = (emp.fullName || emp.displayName || emp.name || '');
          if (roleEl) roleEl.textContent = (emp.jobTitle || 'Department Director');
          return; // Done injecting director, don't add to banner
        }
      }
    }

    var banner = getOrCreateNewStaffSection(deptKey);
    if (!banner) return;

    var cardsContainer = banner.querySelector('.new-staff-cards');
    if (!cardsContainer) return;

    // Determine card tier colour based on job level / management level
    var tierBg = '#4059aa', tierColor = '#fff';
    if (level.includes('director')) { tierBg = '#0D1B2A'; tierColor = '#C9A84C'; }
    else if (level.includes('top') || level.includes('manager')) { tierBg = '#1F4E79'; tierColor = '#fff'; }
    else if (level.includes('middle') || level.includes('assistant')) { tierBg = '#2E75B6'; tierColor = '#fff'; }

    var startDate = emp.tenureStart || emp.startDate || '';

    var card = document.createElement('div');
    card.style.cssText = 'min-width:140px;max-width:175px;padding:10px 12px;border-radius:8px;text-align:center;font-size:11px;line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,0.12);border:2px solid #4CAF50;position:relative;background:' + tierBg + ';color:' + tierColor + ';';
    card.innerHTML =
      '<div style="font-size:10px;font-weight:500;opacity:0.8;margin-bottom:2px;">' + (emp.jobTitle || emp.role || 'Staff') + '</div>' +
      '<div style="font-size:12px;font-weight:700;line-height:1.3;">' + (emp.fullName || emp.displayName || emp.name || '') + '</div>' +
      '<div style="display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:10px;margin-top:5px;background:rgba(76,175,80,0.9);color:#fff;text-transform:uppercase;letter-spacing:0.4px;">LIVE</div>' +
      '<div style="font-size:9px;opacity:0.7;margin-top:3px;">' + (emp.employeeId || emp.id || '') + '</div>' +
      (startDate ? '<div style="font-size:9px;opacity:0.6;margin-top:1px;">Started: ' + startDate + '</div>' : '');

    cardsContainer.appendChild(card);
    newStaffCount++;
  });

  // Update new staff count in nav tabs
  if (newStaffCount > 0) {
    var newBadge = document.createElement('span');
    newBadge.style.cssText = 'margin-left:6px;background:#4CAF50;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;';
    newBadge.textContent = '+' + newStaffCount + ' LIVE';
    var header = document.querySelector('.page-header p');
    if (header) header.appendChild(newBadge);
  }
})();
</script>
<script>
    function navToApp(nextRoute, fallbackPath, e) {
        if (e) e.preventDefault();
        try {
            if (window.top && window.top !== window && window.top.location) {
                window.top.location.href = nextRoute;
                return;
            }
        } catch(err) {}
        window.location.href = fallbackPath;
    }
</script>

</body>
</html>
